services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: debugging_app
      POSTGRES_USER: debugging_app
      POSTGRES_PASSWORD: debugging_app_dev
    ports:
      - "5432:5432"
    volumes:
      - debugging_app_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - debugging_app_redis:/data

volumes:
  debugging_app_postgres:
  debugging_app_redis:
